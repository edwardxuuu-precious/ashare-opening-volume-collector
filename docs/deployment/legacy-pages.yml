# Historical reference only. Not an executable GitHub workflow.
name: Update A-share opening volume
on:
  workflow_dispatch:
    inputs:
      days:
        description: Recent trading days to collect (1-186; 186 covers the six-month window)
        required: true
        default: '186'
  schedule:
    - cron: '17 10 * * 1-5'
permissions:
  contents: read
concurrency:
  group: stock-pages
  cancel-in-progress: false
jobs:
  collect-and-build:
    if: github.event_name == 'workflow_dispatch' || vars.ENABLE_DAILY_UPDATE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Restore saved dates and checkpoints
        uses: actions/cache/restore@v4
        with:
          path: var/work/market-data
          key: market-data-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: market-data-
      - name: Install and test
        run: |
          pip install -r requirements.txt
          npm ci
          python -m unittest discover -s tests/python -v
          node --experimental-strip-types --test tests/frontend/*.test.mjs
      - name: Collect full current A-share universe
        env:
          COLLECT_DAYS: ${{ inputs.days || '5' }}
        run: python backend/scripts/collect.py --full --days "$COLLECT_DAYS" --out var/work/market-data --resume
      - name: Preserve checkpoints even when collection failed
        if: always()
        uses: actions/cache/save@v4
        with:
          path: var/work/market-data
          key: market-data-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Export validated data
        env:
          DAILY_UPDATE_ENABLED: ${{ vars.ENABLE_DAILY_UPDATE }}
        run: python deploy/export_data.py --source var/work/market-data --require-full
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build webpage
        env:
          SITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          npx tsc --noEmit
          npm run build
          touch dist/client/.nojekyll
      - name: Save page artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/client
  deploy:
    needs: collect-and-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish webpage
        id: deployment
        uses: actions/deploy-pages@v4
