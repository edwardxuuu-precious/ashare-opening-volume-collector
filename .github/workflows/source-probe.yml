name: Verify free runner data sources
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stock-source-probe
  cancel-in-progress: false
jobs:
  probe:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Read the exact OIDC subject for scoped AWS trust
        run: |
          python - <<'PY'
          import os, urllib.request, json, base64
          url = os.environ['ACTIONS_ID_TOKEN_REQUEST_URL'] + '&audience=sts.amazonaws.com'
          request = urllib.request.Request(url, headers={'Authorization': 'Bearer '+os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']})
          token = json.load(urllib.request.urlopen(request))['value']
          payload = token.split('.')[1]
          claims = json.loads(base64.urlsafe_b64decode(payload+'='*(-len(payload)%4)))
          print(json.dumps({'oidcSubject': claims['sub'], 'audience': claims['aud'], 'issuer': claims['iss']}))
          PY
      - name: Probe actual primary and backup data sources
        run: python backend/scripts/actions_source_probe.py --report "$RUNNER_TEMP/source-probe.json"
      - name: Show aggregate probe evidence only
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/source-probe.json"; then
            cat "$RUNNER_TEMP/source-probe.json" >> "$GITHUB_STEP_SUMMARY"
          fi
