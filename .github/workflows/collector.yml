name: Collect opening volume into private storage
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Restore probe first; collect only after the old writer is stopped
        required: true
        default: restore_probe
        type: choice
        options:
          - restore_probe
          - collect
          - review
          - price_backfill
      max_minutes:
        description: Total runtime budget; 12 for handoff smoke, 285 for normal updates
        required: true
        default: '285'
        type: string
      review_id:
        description: Stable identifier for one historical review; reuse to resume
        type: string
      review_as_of:
        description: Exclude this date and newer dates (YYYY-MM-DD)
        type: string
      review_dates:
        description: Frozen comma-separated saved dates to review
        type: string
      phase:
        description: Morning opening cache, post-close daily download, or due catch-up
        type: choice
        default: catchup
        options:
          - opening
          - close
          - catchup
      target_date:
        description: Explicit trading date YYYY-MM-DD; empty selects the eligible trading date
        type: string
      backfill_id:
        description: Stable resumable OHLC backfill identifier
        type: string
        default: ohlc-v1-20260920
      backfill_from:
        description: First saved date included in OHLC backfill
        type: string
        default: '2026-03-06'
      backfill_to:
        description: Last saved date included in OHLC backfill
        type: string
        default: '2026-09-18'
      backfill_batch_size:
        description: Newest incomplete dates patched per run, maximum 20
        type: string
        default: '20'
  schedule:
    # Backup only. The independent dispatcher uses Asia/Shanghai schedules.
    - cron: '50 1 * * 1-5'
    # Resume history after opening prefetch; the worker still yields by 15:20.
    - cron: '10 3 * * 1-5'
    - cron: '30 7 * * 1-5'
    - cron: '0 23 * * 0-4'
    - cron: '5 9,11,13,15 * * 1-5'
permissions:
  contents: read
concurrency:
  group: stock-private-writer
  cancel-in-progress: false
jobs:
  collector:
    if: >-
      github.event.repository.private == false &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || vars.DISABLE_DAILY_UPDATE != 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    permissions:
      contents: read
      id-token: write
    env:
      AWS_EC2_METADATA_DISABLED: 'true'
      AWS_DEFAULT_REGION: us-east-1
      STOCK_BUCKET: ${{ vars.STOCK_BUCKET }}
      STOCK_MODE: ${{ inputs.mode || 'collect' }}
      STOCK_WRITER_DISABLED: ${{ vars.DISABLE_DAILY_UPDATE }}
      STOCK_MAX_MINUTES: ${{ inputs.max_minutes || '285' }}
      STOCK_REVIEW_ID: ${{ inputs.review_id }}
      STOCK_REVIEW_AS_OF: ${{ inputs.review_as_of }}
      STOCK_REVIEW_DATES: ${{ inputs.review_dates }}
      STOCK_PHASE: ${{ inputs.phase }}
      STOCK_TARGET_DATE: ${{ inputs.target_date }}
      STOCK_BACKFILL_ID: ${{ inputs.backfill_id }}
      STOCK_BACKFILL_FROM: ${{ inputs.backfill_from }}
      STOCK_BACKFILL_TO: ${{ inputs.backfill_to }}
      STOCK_BACKFILL_BATCH_SIZE: ${{ inputs.backfill_batch_size }}
      STOCK_SCHEDULE: ${{ github.event.schedule }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-duration-seconds: 21600
          role-session-name: stock-${{ github.run_id }}
          aws-region: us-east-1
      - name: Restore, collect incrementally, and save privately
        shell: bash
        run: |
          set -euo pipefail
          test -n "$STOCK_BUCKET"
          review_args=()
          case "$STOCK_MODE" in
            restore_probe) mode=probe ;;
            collect)
              mode=auto
              phase="${STOCK_PHASE:-catchup}"
              if [ "$STOCK_SCHEDULE" = '50 1 * * 1-5' ]; then phase=opening; fi
              if [ "$STOCK_SCHEDULE" = '30 7 * * 1-5' ]; then phase=close; fi
              review_args=(--phase "$phase")
              if [ -n "$STOCK_TARGET_DATE" ]; then review_args+=(--target-date "$STOCK_TARGET_DATE"); fi
              ;;
            review)
              mode=review
              test "$STOCK_WRITER_DISABLED" = true
              review_args=(--review-id "$STOCK_REVIEW_ID" --review-as-of "$STOCK_REVIEW_AS_OF" --review-dates "$STOCK_REVIEW_DATES")
              ;;
            price_backfill)
              mode=price_backfill
              review_args=(--backfill-id "$STOCK_BACKFILL_ID" --backfill-from "$STOCK_BACKFILL_FROM" \
                --backfill-to "$STOCK_BACKFILL_TO" --backfill-batch-size "$STOCK_BACKFILL_BATCH_SIZE")
              ;;
            *) exit 2 ;;
          esac
          runner_result="$RUNNER_TEMP/collector-result.jsonl"
          set +e
          python backend/server/actions_runner.py --bucket "$STOCK_BUCKET" \
            --root "$RUNNER_TEMP/stock" --region us-east-1 \
            --mode "$mode" --max-minutes "$STOCK_MAX_MINUTES" "${review_args[@]}" | tee "$runner_result"
          runner_rc=${PIPESTATUS[0]}
          set -e
          python - "$runner_result" <<'PY'
          import json
          import os
          import sys

          allowed = (
              "outcome", "phase", "targetDate", "dataComplete", "priceDataComplete", "openingComplete",
              "checkpointSaved", "unprocessedCount", "retryableCount", "nextRetryAt",
              "exitReason", "publishedAt", "publicationCommitted", "elapsedSeconds",
              "priceBackfillId", "priceBackfillCompleted", "priceBackfillSelectedDates",
              "priceBackfillRemainingDates",
          )
          result = {}
          for line in open(sys.argv[1], encoding="utf-8"):
              try:
                  candidate = json.loads(line)
              except json.JSONDecodeError:
                  continue
              if isinstance(candidate, dict):
                  result = candidate
          def cell(value):
              if value is None:
                  return "—"
              return str(value).replace(chr(10), " ").replace("|", chr(92) + "|")[:160]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## Private collector result" + chr(10) + chr(10))
              summary.write("| Field | Value |" + chr(10) + "| --- | --- |" + chr(10))
              for key in allowed:
                  summary.write(f"| {key} | {cell(result.get(key))} |" + chr(10))
          PY
          exit "$runner_rc"
