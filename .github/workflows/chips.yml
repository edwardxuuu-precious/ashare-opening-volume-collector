name: Daily whole-market chip estimates
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Bounded source check or private whole-market calculation
        type: choice
        options: [collect, probe]
        default: collect
      as_of:
        description: Completed exchange session YYYY-MM-DD; empty selects latest
        type: string
      max_minutes:
        description: Runtime budget 2..285 minutes; checkpointed for continuation
        type: string
        default: '285'
      automatic_origin:
        description: Internal scheduler origin; empty for a separately authorized manual run
        type: string
      auto_slot:
        description: Internal daily allowance primary, evening or overnight
        type: string
  schedule:
    # 15:40 Shanghai, with unchanged 21:20 / next-day 02:20 bounded catch-up runs.
    - cron: '40 7 * * *'
    - cron: '20 13 * * *'
    - cron: '20 18 * * *'
  workflow_run:
    workflows: [Collect opening volume into private storage]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: stock-chip-writer
  cancel-in-progress: false
jobs:
  chips:
    if: >-
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'workflow_dispatch' && inputs.automatic_origin == '') || vars.DISABLE_CHIPS_UPDATE != 'true') &&
      (github.event_name != 'workflow_run' ||
      (github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == 'edwardxuuu-precious/ashare-opening-volume-collector'))
    runs-on: ubuntu-24.04
    timeout-minutes: 310
    permissions:
      contents: read
      id-token: write
    env:
      AWS_EC2_METADATA_DISABLED: 'true'
      AWS_DEFAULT_REGION: us-east-1
      STOCK_BUCKET: ${{ vars.STOCK_BUCKET }}
      STOCK_AS_OF: ${{ inputs.as_of }}
      STOCK_MAX_MINUTES: ${{ inputs.max_minutes || '285' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: pip install 'boto3>=1.40,<2' 'baostock==0.9.3'
      - uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c
        if: inputs.mode != 'probe'
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-duration-seconds: 21600
          role-session-name: chips-${{ github.run_id }}
          aws-region: us-east-1
      - name: Check trusted automatic daily allowance
        id: followup
        if: inputs.mode != 'probe' && (github.event_name != 'workflow_dispatch' || inputs.automatic_origin != '')
        run: python tooling/chip_followup_guard.py
      - name: Compute privately and commit the complete scan
        if: inputs.mode != 'probe' && ((github.event_name == 'workflow_dispatch' && inputs.automatic_origin == '') || steps.followup.outputs.should_run == 'true')
        shell: bash
        env:
          FOLLOWUP_AS_OF: ${{ steps.followup.outputs.as_of }}
          FOLLOWUP_MAX_MINUTES: ${{ steps.followup.outputs.max_minutes }}
        run: |
          set -euo pipefail
          if [ -n "$FOLLOWUP_AS_OF" ]; then
            STOCK_AS_OF="$FOLLOWUP_AS_OF"
            STOCK_MAX_MINUTES="$FOLLOWUP_MAX_MINUTES"
          fi
          args=()
          if [ -n "$STOCK_AS_OF" ]; then args+=(--as-of "$STOCK_AS_OF"); fi
          python tooling/run_chip_bounded.py --bucket "$STOCK_BUCKET" --max-minutes "$STOCK_MAX_MINUTES" "${args[@]}"
          if [ -n "$FOLLOWUP_AS_OF" ]; then
            python tooling/chip_followup_guard.py --verify-as-of "$STOCK_AS_OF"
          fi
      - name: Derive bounded concentration nonincreasing groups from saved inputs
        if: inputs.mode != 'probe'
        timeout-minutes: 21
        shell: bash
        run: |
          set -euo pipefail
          draft="$RUNNER_TEMP/concentration-v2-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          set +e
          timeout --signal=TERM --kill-after=10s 1190s python -m backend.chips.concentration_v2_runner --bucket "$STOCK_BUCKET" --max-minutes 20 --workers 2 --out "$draft" --publish
          result=$?
          set -e
          if [ "$result" = 124 ] || [ "$result" = 137 ] || [ "$result" = 130 ] || [ "$result" = 143 ]; then
            python - "$draft" <<'PY'
          import json,re,sys
          from pathlib import Path
          report={'outcome':'NEEDS_ATTENTION','reason':'CONCENTRATION_PROCESS_TIMEOUT',
              'publication_state':'unknown','publication_verified':False,
              'final_key':None,'input_fingerprint':None,
              'recovery':'Read the same dataset-bound final_key before resuming; never blindly repeat the final PUT.'}
          path=Path(sys.argv[1])
          try:
              if path.is_file() and path.stat().st_size<=32*1024*1024:
                  value=json.loads(path.read_bytes())
                  dataset=value.get('dataset_id','') if isinstance(value,dict) else ''
                  fingerprint=value.get('input_fingerprint','') if isinstance(value,dict) else ''
                  if re.fullmatch('[a-f0-9]{16}',dataset) and re.fullmatch('[a-f0-9]{64}',fingerprint):
                      report.update(final_key=f'data/chips/daily/{dataset}/concentration-v2.json',input_fingerprint=fingerprint)
          except (OSError,ValueError,TypeError):
              pass
          print(json.dumps(report))
          PY
          fi
          exit "$result"
      - name: Bounded source health check
        if: inputs.mode == 'probe'
        run: python -m backend.chips.probe
